# Render Blueprint：在 Render 選 New → Blueprint 並指向此 repo 即可一次建立前後端
services:
  - type: web
    name: stock-forecast-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_BASE_URL          # 例：https://raw.githubusercontent.com/你的帳號/你的repo/main/data
        sync: false
      - key: ALLOWED_ORIGINS        # 例：https://stock-forecast-web.onrender.com
        sync: false

  - type: web
    name: stock-forecast-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE          # 例：https://stock-forecast-api.onrender.com
        sync: false
